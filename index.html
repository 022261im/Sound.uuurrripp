<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Potato Virtual</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    body { font-family: Arial, sans-serif; }
    .stage { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: #171717; }
    #camera {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); background: #171717;
    }
    #avatar-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #potato {
      position: absolute; left: 50%; top: 50%; width: clamp(150px, 23vw, 310px);
      aspect-ratio: 0.82; transform: translate(-50%, -50%);
      transform-origin: 50% 55%; opacity: 0; will-change: left, top, transform, opacity;
      filter: drop-shadow(0 9px 12px rgba(0,0,0,.18));
    }
    #potato svg { width: 100%; height: 100%; overflow: visible; }
    .eye { transform-box: fill-box; transform-origin: center; }
    #mouth { transform-box: fill-box; transform-origin: center; }
    #filter-toggle {
      position: absolute; z-index: 5; right: 22px; bottom: 22px;
      border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      padding: 13px 22px; color: white; background: rgba(20,20,20,.72);
      backdrop-filter: blur(12px); font-size: 15px; font-weight: 650;
      cursor: pointer;
    }
    #filter-toggle:hover { background: rgba(20,20,20,.9); }
    #filter-toggle:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #status {
      position: absolute; z-index: 4; left: 18px; bottom: 22px;
      color: rgba(255,255,255,.78); font-size: 12px;
      text-shadow: 0 1px 5px #000; pointer-events: none;
    }
    @media (max-width: 600px) {
      #filter-toggle { right: 14px; bottom: 14px; padding: 11px 18px; }
      #status { left: 14px; bottom: 18px; }
      #potato { width: clamp(145px, 42vw, 230px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <video id="camera" autoplay playsinline muted></video>
    <div id="avatar-layer" aria-hidden="true">
      <div id="potato">
        <svg viewBox="0 0 300 360" role="img" aria-label="감자 캐릭터">
          <defs>
            <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e7c58e"/>
              <stop offset=".55" stop-color="#c99a5d"/>
              <stop offset="1" stop-color="#a97843"/>
            </linearGradient>
          </defs>
          <path d="M150 20 C205 12 257 54 273 119 C289 184 272 270 226 316 C188 354 108 351 66 318 C20 282 13 202 29 132 C44 68 91 26 150 20Z"
            fill="url(#skin)" stroke="#8f6239" stroke-width="5"/>
          <path d="M58 99 Q75 82 87 91 M219 70 Q235 78 239 94 M42 229 Q55 219 64 230 M227 275 Q242 263 250 276"
            fill="none" stroke="#ae804e" stroke-width="5" stroke-linecap="round" opacity=".55"/>
          <ellipse class="eye" id="eye-left" cx="105" cy="164" rx="8" ry="10" fill="#292019"/>
          <ellipse class="eye" id="eye-right" cx="195" cy="164" rx="8" ry="10" fill="#292019"/>
          <path id="mouth" d="M137 218 Q150 224 163 218" fill="none" stroke="#553322" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div id="status">카메라 연결 중...</div>
    <button id="filter-toggle" type="button" aria-pressed="true">필터 끄기</button>
  </main>

  <script type="module">
    import { FaceLandmarker, PoseLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("camera");
    const potato = document.getElementById("potato");
    const toggle = document.getElementById("filter-toggle");
    const status = document.getElementById("status");
    const eyeLeft = document.getElementById("eye-left");
    const eyeRight = document.getElementById("eye-right");
    const mouth = document.getElementById("mouth");

    let faceTracker, poseTracker, filterOn = true, lastVideoTime = -1;
    let targetX = innerWidth / 2, targetY = innerHeight / 2;
    let smoothX = targetX, smoothY = targetY, smoothRoll = 0, smoothScale = 1;
    let blink = 0, mouthOpen = 0, hasFace = false;

    toggle.addEventListener("click", () => {
      filterOn = !filterOn;
      toggle.textContent = filterOn ? "필터 끄기" : "필터 켜기";
      toggle.setAttribute("aria-pressed", String(filterOn));
      potato.style.opacity = filterOn && hasFace ? "1" : "0";
    });

    function getBlendshape(categories, name) {
      return categories?.find(item => item.categoryName === name)?.score ?? 0;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await new Promise(resolve => video.addEventListener("loadeddata", resolve, { once: true }));

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        const modelBase = "https://storage.googleapis.com/mediapipe-models";
        faceTracker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelBase + "/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: true
        });
        poseTracker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelBase + "/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" },
          runningMode: "VIDEO",
          numPoses: 1
        });
        status.textContent = "얼굴과 움직임 인식 중";
        requestAnimationFrame(track);
      } catch (error) {
        console.error(error);
        status.textContent = "카메라 또는 인식 모델을 불러오지 못했습니다.";
      }
    }

    function track() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const faceResult = faceTracker.detectForVideo(video, now);
        const poseResult = poseTracker.detectForVideo(video, now);
        const face = faceResult.faceLandmarks?.[0];

        if (face) {
          hasFace = true;
          const nose = face[1];
          const leftEye = face[33];
          const rightEye = face[263];
          const eyeMidX = (leftEye.x + rightEye.x) / 2;
          const eyeMidY = (leftEye.y + rightEye.y) / 2;
          const eyeDistance = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);

          // 좌우 반전된 카메라 화면에 맞춰 좌표를 변환합니다.
          targetX = (1 - nose.x) * innerWidth;
          targetY = nose.y * innerHeight - eyeDistance * innerHeight * 0.15;

          const roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
          smoothRoll += (roll - smoothRoll) * 0.25;
          const faceWidth = Math.hypot(face[234].x - face[454].x);
          smoothScale += (clamp(faceWidth * 3.0, 0.72, 1.55) - smoothScale) * 0.18;

          const blend = faceResult.faceBlendshapes?.[0]?.categories;
          const blinkValue = Math.max(getBlendshape(blend, "eyeBlinkLeft"), getBlendshape(blend, "eyeBlinkRight"));
          const jawValue = getBlendshape(blend, "jawOpen");
          blink += (clamp(blinkValue, 0, 1) - blink) * 0.45;
          mouthOpen += (clamp(jawValue, 0, 1) - mouthOpen) * 0.35;

          // 어깨 위치를 이용해 상체가 움직일 때 캐릭터 위치도 자연스럽게 따라갑니다.
          const pose = poseResult.landmarks?.[0];
          if (pose && pose[11]?.visibility > 0.35 && pose[12]?.visibility > 0.35) {
            const shoulderX = (pose[11].x + pose[12].x) / 2;
            const shoulderY = (pose[11].y + pose[12].y) / 2;
            targetX = targetX * 0.78 + (1 - shoulderX) * innerWidth * 0.22;
            targetY = targetY * 0.82 + shoulderY * innerHeight * 0.18 - 105;
          }

          if (filterOn) potato.style.opacity = "1";
          eyeLeft.setAttribute("transform", `translate(0 0) scale(1 ${Math.max(0.08, 1 - blink * 0.92)})`);
          eyeRight.setAttribute("transform", `translate(0 0) scale(1 ${Math.max(0.08, 1 - blink * 0.92)})`);

          const mouthHeight = 3 + mouthOpen * 34;
          mouth.setAttribute("d", `M137 218 Q150 ${218 + mouthHeight} 163 218`);
          mouth.setAttribute("stroke-width", String(6 + mouthOpen * 2));
        } else {
          hasFace = false;
          potato.style.opacity = "0";
        }
      }

      smoothX += (targetX - smoothX) * 0.22;
      smoothY += (targetY - smoothY) * 0.22;
      potato.style.left = smoothX + "px";
      potato.style.top = smoothY + "px";
      potato.style.transform = `translate(-50%, -50%) rotate(${smoothRoll * 180 / Math.PI}deg) scale(${smoothScale})`;

      requestAnimationFrame(track);
    }

    window.addEventListener("resize", () => {
      targetX = innerWidth / 2;
      targetY = innerHeight / 2;
    });

    start();
  </script>
</body>
</html>
