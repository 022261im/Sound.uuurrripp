<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 웹 데시벨 측정기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .card-title {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text);
        }

        #current-db {
            color: var(--primary);
            font-size: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #start-btn { background-color: var(--primary); color: white; }
        #start-btn:hover { background-color: var(--primary-hover); }

        #stop-btn { background-color: var(--danger); color: white; display: none; }
        #stop-btn:hover { background-color: var(--danger-hover); }

        #csv-btn { background-color: var(--success); color: white; display: none; }
        #csv-btn:hover { background-color: #059669; }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ 실시간 웹 데시벨 측정기</h1>

    <div class="dashboard">
        <div class="card">
            <div class="card-title">현재 데시벨</div>
            <div class="card-value" id="current-db">- dB</div>
        </div>
        <div class="card">
            <div class="card-title">평균 데시벨</div>
            <div class="card-value" id="avg-db">- dB</div>
        </div>
        <div class="card">
            <div class="card-title">측정 시작 시간</div>
            <div class="card-value" id="start-time" style="font-size: 1rem;">-</div>
        </div>
        <div class="card">
            <div class="card-title">진행 시간</div>
            <div class="card-value" id="duration">0.0초</div>
        </div>
    </div>

    <div class="btn-group">
        <button id="start-btn">측정 시작</button>
        <button id="stop-btn">측정 종료</button>
        <button id="csv-btn">CSV 다운로드</button>
    </div>

    <div class="chart-container">
        <canvas id="dbChart"></canvas>
    </div>
</div>

<script>
    let audioContext;
    let analyser;
    let dataArray;
    let source;
    let isMeasuring = false;
    
    // 데이터 기록용 배열
    let dbHistory = [];
    let timeHistory = [];
    
    let startTimeTicks;
    let startTimeString;
    let timerInterval;
    let chart;

    // DOM 요소 링크
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const csvBtn = document.getElementById('csv-btn');
    const currentDbEl = document.getElementById('current-db');
    const avgDbEl = document.getElementById('avg-db');
    const startTimeEl = document.getElementById('start-time');
    const durationEl = document.getElementById('duration');

    // Chart.js 초기화 함수
    function initChart() {
        const ctx = document.getElementById('dbChart').getContext('2d');
        if (chart) chart.destroy(); // 기존 차트가 있다면 초기화
        
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '소음 크기 (dB)',
                    data: [],
                    borderColor: '#4f46e5',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0, // 그래프 부드럽게 표현하기 위해 점 생략
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: '경과 시간 (초)' } },
                    y: { min: 0, max: 120, title: { display: true, text: '데시벨 (dB)' } }
                }
            }
        });
    }

    // 측정 시작 로직
    startBtn.addEventListener('click', async () => {
        try {
            // 마이크 권한 요청 및 오디오 스트림 획득
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            isMeasuring = true;
            dbHistory = [];
            timeHistory = [];
            initChart();

            // 시간 기록 시작
            const now = new Date();
            startTimeTicks = performance.now();
            startTimeString = now.toLocaleTimeString();
            startTimeEl.textContent = startTimeString;

            // 웹 오디오 API 세팅
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Float32Array(bufferLength);

            // UI 변경
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            csvBtn.style.display = 'none';

            // 실시간 분석 루프 가동
            analyzeAudio();
            
            // 상단 진행시간 타이머 가동 (0.1초마다 갱신)
            timerInterval = setInterval(() => {
                const elapsed = ((performance.now() - startTimeTicks) / 1000).toFixed(1);
                durationEl.textContent = `${elapsed}초`;
            }, 100);

        } catch (err) {
            alert('마이크 접근 권한이 거부되었거나 마이크를 찾을 수 없습니다.');
            console.error(err);
        }
    });

    // 오디오 분석 및 데시벨 계산 함수
    function analyzeAudio() {
        if (!isMeasuring) return;

        requestAnimationFrame(analyzeAudio);

        // 시간 도메인 데이터(진폭) 가져오기
        analyser.getFloatTimeDomainData(dataArray);

        // 실시간 음압(RMS) 계산
        let sumSquares = 0.0;
        for (const amplitude of dataArray) {
            sumSquares += amplitude * amplitude;
        }
        let rms = Math.sqrt(sumSquares / dataArray.length);

        // RMS 기반 데시벨(dB) 계산 (기본 보정값 +100 가산)
        let db = 0;
        if (rms > 0) {
            db = 20 * Math.log10(rms) + 100;
        }
        // 음소거 상태일 때 마이너스 무한대로 가는 것 방지
        db = Math.max(0, Math.min(db, 130)); 

        const elapsedSeconds = ((performance.now() - startTimeTicks) / 1000).toFixed(2);

        // 기록 저장
        dbHistory.push(parseFloat(db.toFixed(1)));
        timeHistory.push(parseFloat(elapsedSeconds));

        // UI 갱신
        currentDbEl.textContent = `${db.toFixed(1)} dB`;

        // 그래프 데이터 실시간 추가 (성능 관리를 위해 최근 100개까지만 노출)
        chart.data.labels.push(elapsedSeconds);
        chart.data.datasets[0].data.push(db.toFixed(1));
        if (chart.data.labels.length > 100) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }
        chart.update('none'); // 애니메이션 없이 빠르게 업데이트
    }

    // 측정 종료 로직
    stopBtn.addEventListener('click', () => {
        isMeasuring = false;
        clearInterval(timerInterval);

        // 오디오 스트림 및 컨텍스트 정지
        if (source) source.mediaStream.getTracks().forEach(track => track.stop());
        if (audioContext) audioContext.close();

        // 전체 평균 데시벨 계산
        if (dbHistory.length > 0) {
            const sum = dbHistory.reduce((a, b) => a + b, 0);
            const avg = (sum / dbHistory.length).toFixed(1);
            avgDbEl.textContent = `${avg} dB`;
            
            // 그래프에 평균값 점선 표시 추가
            chart.options.plugins.annotation = {
                annotations: {
                    line1: {
                        type: 'line',
                        yMin: avg,
                        yMax: avg,
                        borderColor: 'rgb(255, 99, 132)',
                        borderWidth: 2,
                        borderDash: [6, 6]
                    }
                }
            };
        }

        // 그래프를 전체 데이터 기반으로 다시 그려서 전체 요약본 출력
        chart.data.labels = timeHistory;
        chart.data.datasets[0].data = dbHistory;
        chart.update();

        // UI 변경
        startBtn.style.display = 'inline-block';
        startBtn.textContent = '재측정 시작';
        stopBtn.style.display = 'none';
        csvBtn.style.display = 'inline-block';
    });

    // CSV 파일로 저장 및 다운로드 기능
    csvBtn.addEventListener('click', () => {
        if (dbHistory.length === 0) return;

        // CSV 문자열 생성
        let csvContent = "\uFEFFTime(s),Decibel(dB)\n"; // 엑셀 한글 깨짐 방지 BOM 추가
        for (let i = 0; i < dbHistory.length; i++) {
            csvContent += `${timeHistory[i]},${dbHistory[i]}\n`;
        }

        // 가상 링크를 만들어 다운로드 트리거
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `decibel_report_${startTimeString.replace(/ /g, '')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
