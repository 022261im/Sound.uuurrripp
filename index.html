<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Potato Virtual</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#171717; }
    body { font-family:Arial,sans-serif; }
    .stage { position:relative; width:100vw; height:100dvh; overflow:hidden; background:#171717; }
    #output { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .stage { background:#dce8e5; }
    #camera { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    #avatar-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    #potato {
      position:absolute; left:50%; top:0; width:min(54vw, 700px); aspect-ratio:0.72;
      transform:translate(-50%,0); transform-origin:50% 30%;
      opacity:0; will-change:left,top,width,transform,opacity;
      filter:drop-shadow(0 12px 16px rgba(65,39,17,.15));
    }
    #potato svg { width:100%; height:100%; display:block; overflow:visible; }
    .eye { transform-box:fill-box; transform-origin:center; }
    #background-picker {
      position:absolute; z-index:6; right:20px; bottom:88px;
      display:flex; align-items:center; gap:8px;
      padding:9px 11px; border:1px solid rgba(255,255,255,.18);
      border-radius:18px; background:rgba(20,20,20,.72);
      backdrop-filter:blur(12px);
    }
    .background-choice {
      width:27px; height:27px; border-radius:50%; border:2px solid rgba(255,255,255,.55);
      padding:0; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25);
    }
    .background-choice[aria-pressed="true"] { outline:2px solid white; outline-offset:3px; }
    .background-choice:focus-visible { outline:3px solid white; outline-offset:4px; }
    #filter-toggle {
      position:absolute; z-index:6; right:20px; bottom:20px;
      border:1px solid rgba(255,255,255,.25); border-radius:999px;
      padding:13px 22px; color:white; background:rgba(20,20,20,.76);
      backdrop-filter:blur(12px); font-size:15px; font-weight:650; cursor:pointer;
    }
    #filter-toggle:hover { background:rgba(20,20,20,.94); }
    #filter-toggle:focus-visible { outline:3px solid white; outline-offset:3px; }
    #status {
      position:absolute; z-index:4; left:18px; bottom:20px;
      color:rgba(255,255,255,.8); font-size:12px;
      text-shadow:0 1px 5px #000; pointer-events:none;
    }
    @media(max-width:600px) {
      #background-picker { right:14px; bottom:78px; gap:7px; padding:8px 10px; }
      .background-choice { width:25px; height:25px; }
      #filter-toggle { right:14px; bottom:14px; padding:11px 18px; }
      #potato { width: min(88vw, 520px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="output"></canvas>
    <video id="camera" autoplay playsinline muted></video>

    <div id="avatar-layer" aria-hidden="true">
      <div id="potato">
        <svg viewBox="0 0 500 700">
          <defs>
            <linearGradient id="skin" x1="0" y1="0" x2="0.85" y2="1">
              <stop offset="0" stop-color="#e9c58e"/>
              <stop offset=".52" stop-color="#d7aa70"/>
              <stop offset="1" stop-color="#bd8951"/>
            </linearGradient>
            <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a97843" stop-opacity=".08"/>
              <stop offset="1" stop-color="#81552e" stop-opacity=".24"/>
            </linearGradient>
          </defs>
          <!-- 머리부터 어깨와 상체까지 이어지는 큰 감자 실루엣 -->
          <path d="M250 10
            C365 4 457 75 480 190
            C501 293 476 405 457 500
            C445 565 468 630 440 676
            C408 724 92 724 60 676
            C32 630 55 565 43 500
            C24 405 -1 293 20 190
            C43 75 135 4 250 10Z"
            fill="url(#skin)" stroke="#a87948" stroke-width="7"/>
          <path d="M250 14
            C365 8 451 80 472 190
            C490 286 468 402 449 496
            C438 562 458 625 431 665
            C395 700 105 700 69 665
            C42 625 62 562 51 496
            C32 402 10 286 28 190
            C49 80 135 8 250 14Z"
            fill="url(#shade)"/>
          <!-- 감자 표면의 작은 점 -->
          <path d="M93 150 Q111 126 132 137 M369 115 Q391 125 402 148
                   M74 440 Q92 457 108 448 M389 468 Q411 481 426 462"
            fill="none" stroke="#b88752" stroke-width="13" stroke-linecap="round" opacity=".28"/>
          <ellipse class="eye" id="eye-left" cx="185" cy="286" rx="11" ry="14" fill="#302219"/>
          <ellipse class="eye" id="eye-right" cx="315" cy="286" rx="11" ry="14" fill="#302219"/>
          <path id="mouth" d="M215 350 Q250 382 285 350" fill="none"
            stroke="#583827" stroke-width="8" stroke-linecap="round"/>
          <ellipse id="mouth-open" cx="250" cy="362" rx="21" ry="4"
            fill="#583827" opacity="0" />
        </svg>
      </div>
    </div>

    <div id="status">카메라 연결 중...</div>
    <div id="background-picker" aria-label="배경 선택">
      <button class="background-choice" type="button" data-bg="#dce8e5" aria-label="연한 민트 배경" title="민트" style="background:#dce8e5" aria-pressed="true"></button>
      <button class="background-choice" type="button" data-bg="#e8d8c4" aria-label="베이지 배경" title="베이지" style="background:#e8d8c4" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#cbd8ed" aria-label="하늘색 배경" title="하늘색" style="background:#cbd8ed" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#e8cbd0" aria-label="분홍 배경" title="분홍" style="background:#e8cbd0" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#d5d5d5" aria-label="회색 배경" title="회색" style="background:#d5d5d5" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#252b35" aria-label="짙은 남색 배경" title="다크" style="background:#252b35" aria-pressed="false"></button>
    </div>
    <button id="filter-toggle" type="button" aria-pressed="true">필터 끄기</button>
  </main>

  <script type="module">
    import { FaceLandmarker, PoseLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("camera");
    const output = document.getElementById("output");
    const ctx = output.getContext("2d");
    const potato = document.getElementById("potato");
    const toggle = document.getElementById("filter-toggle");
    const status = document.getElementById("status");
    const eyeLeft = document.getElementById("eye-left");
    const eyeRight = document.getElementById("eye-right");
    const mouth = document.getElementById("mouth");
    const mouthOpen = document.getElementById("mouth-open");
    const bgButtons = [...document.querySelectorAll(".background-choice")];

    let faceTracker, poseTracker;
    let filterOn = true;
    let backgroundColor = "#dce8e5";
    let lastVideoTime = -1, lastInferenceTime = 0, lastFrameTime = 0;
    let lastFaceTime = 0, hasFace = false;

    const motion = {
      x: innerWidth/2, top: 0, width: Math.min(innerWidth*.54,700),
      roll: 0, gazeLX:0, gazeLY:0, gazeRX:0, gazeRY:0, blink:0, mouth:0
    };
    const target = { ...motion };
    const clamp = (v,min,max) => Math.max(min,Math.min(max,v));
    const mix = (a,b,t) => a+(b-a)*t;
    const smoothing = (dt,speed) => 1-Math.exp(-dt*speed);
    const blendValue = (items,name) => items?.find(x=>x.categoryName===name)?.score ?? 0;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
      if (output.width!==w || output.height!==h) {
        output.width=w; output.height=h;
      }
    }

    // 카메라 영상은 배경으로 절대 사용하지 않습니다. 선택한 단색만 전체 화면에 출력합니다.
    function drawBackground() {
      resizeCanvas();
      ctx.fillStyle = backgroundColor;
      ctx.fillRect(0,0,output.width,output.height);
    }

    function videoPointToScreen(point) {
      const vw=video.videoWidth||1, vh=video.videoHeight||1;
      const scale=Math.max(innerWidth/vw,innerHeight/vh);
      const rw=vw*scale, rh=vh*scale;
      const cropX=(rw-innerWidth)/2, cropY=(rh-innerHeight)/2;
      return {
        x: innerWidth-(point.x*rw-cropX),
        y: point.y*rh-cropY
      };
    }

    bgButtons.forEach(button=>button.addEventListener("click",()=>{
      backgroundColor=button.dataset.bg;
      bgButtons.forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
      drawBackground();
    }));

    toggle.addEventListener("click",()=>{
      filterOn=!filterOn;
      toggle.textContent=filterOn?"필터 끄기":"필터 켜기";
      toggle.setAttribute("aria-pressed",String(filterOn));
      if (filterOn) {
        drawBackground();
        potato.style.opacity=hasFace?"1":"0";
      } else {
        potato.style.opacity="0";
        // 필터를 끄면 원본 카메라를 캔버스에 표시합니다.
      }
    });

    async function createTracker(Tracker,vision,options) {
      try { return await Tracker.createFromOptions(vision,options); }
      catch (gpuError) {
        console.warn("GPU 초기화 실패. CPU로 다시 시도합니다.",gpuError);
        return Tracker.createFromOptions(vision,{
          ...options,baseOptions:{...options.baseOptions,delegate:"CPU"}
        });
      }
    }

    async function start() {
      try {
        const stream=await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}
        });
        video.srcObject=stream;
        await new Promise((resolve,reject)=>{
          video.addEventListener("loadeddata",resolve,{once:true});
          video.addEventListener("error",reject,{once:true});
        });
        await video.play();

        const vision=await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        const base="https://storage.googleapis.com/mediapipe-models";
        faceTracker=await createTracker(FaceLandmarker,vision,{
          baseOptions:{modelAssetPath:base+"/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
          runningMode:"VIDEO",numFaces:1,
          minFaceDetectionConfidence:.55,minFacePresenceConfidence:.55,
          minTrackingConfidence:.55,outputFaceBlendshapes:true
        });
        poseTracker=await createTracker(PoseLandmarker,vision,{
          baseOptions:{modelAssetPath:base+"/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
          runningMode:"VIDEO",numPoses:1,
          minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5
        });

        status.textContent="얼굴과 상체 움직임 인식 중";
        drawBackground();
        requestAnimationFrame(track);
      } catch(error) {
        console.error(error);
        status.textContent="카메라 또는 인식 모델을 불러오지 못했습니다.";
      }
    }

    function updateTracking(faceResult,poseResult,now) {
      const face=faceResult.faceLandmarks?.[0];
      if (!face) {
        if (now-lastFaceTime>350) {
          hasFace=false;
          potato.style.opacity="0";
          target.blink=target.mouth=0;
          target.gazeLX=target.gazeLY=target.gazeRX=target.gazeRY=0;
        }
        return;
      }

      hasFace=true;
      lastFaceTime=now;
      const nose=videoPointToScreen(face[1]);
      const leftEye=videoPointToScreen(face[33]);
      const rightEye=videoPointToScreen(face[263]);
      const eyeDistance=Math.hypot(rightEye.x-leftEye.x,rightEye.y-leftEye.y);
      const pose=poseResult.poseLandmarks?.[0];

      // 얼굴 추적은 캐릭터의 중심과 표정을, 어깨 추적은 몸통의 폭과 기울기를 결정합니다.
      let centerX=nose.x;
      let shoulderLineY=nose.y+eyeDistance*2.25;
      let shoulderSpan=eyeDistance*2.7;
      let shoulderTilt=0;

      if (pose?.[11] && pose?.[12]) {
        const l=pose[11], r=pose[12];
        const visibility=Math.min(l.visibility??0,r.visibility??0);
        if (visibility>.35) {
          const ls=videoPointToScreen(l), rs=videoPointToScreen(r);
          centerX=(ls.x+rs.x)/2;
          shoulderLineY=(ls.y+rs.y)/2;
          shoulderSpan=Math.hypot(rs.x-ls.x,rs.y-ls.y);
          shoulderTilt=Math.atan2(rs.y-ls.y,rs.x-ls.x);
        }
      }

      // 몸통은 화면 폭의 약 40~58% 안에서 유지해 지나치게 확대되지 않도록 합니다.
      const minWidth=Math.min(360,innerWidth*.42);
      const maxWidth=Math.min(760,innerWidth*.68);
      target.width=clamp(shoulderSpan*1.65,minWidth,maxWidth);
      const avatarHeight=target.width/0.72;
      const foreheadY=nose.y-eyeDistance*1.85;
      target.x=centerX;
      target.top=clamp(foreheadY,-avatarHeight*.08,innerHeight*.18);
      target.roll=clamp(shoulderTilt*.28+Math.atan2(rightEye.y-leftEye.y,rightEye.x-leftEye.x)*.72,-.18,.18);

      const categories=faceResult.faceBlendshapes?.[0]?.categories;
      target.blink=clamp(Math.max(blendValue(categories,"eyeBlinkLeft"),blendValue(categories,"eyeBlinkRight")),0,1);
      target.mouth=clamp(blendValue(categories,"jawOpen"),0,1);

      if (face.length>473) {
        const eyes=[
          {iris:face[468],a:face[33],b:face[133],t:face[159],bt:face[145]},
          {iris:face[473],a:face[362],b:face[263],t:face[386],bt:face[374]}
        ];
        const g=eyes.map(e=>{
          const cx=(e.a.x+e.b.x)/2, cy=(e.t.y+e.bt.y)/2;
          const hw=Math.max(Math.abs(e.a.x-e.b.x)/2,.002);
          const hh=Math.max(Math.abs(e.t.y-e.bt.y)/2,.002);
          return {x:clamp((e.iris.x-cx)/hw,-1,1)*8,y:clamp((e.iris.y-cy)/hh,-1,1)*6};
        });
        target.gazeLX=g[0].x; target.gazeLY=g[0].y;
        target.gazeRX=g[1].x; target.gazeRY=g[1].y;
      }

      potato.style.opacity=filterOn?"1":"0";
    }

    function renderAvatar(now) {
      const dt=Math.min((now-(lastFrameTime||now))/1000,.05);
      lastFrameTime=now;
      const p=smoothing(dt,9), details=smoothing(dt,18), size=smoothing(dt,6);
      motion.x=mix(motion.x,target.x,p);
      motion.top=mix(motion.top,target.top,p);
      motion.width=mix(motion.width,target.width,size);
      motion.roll=mix(motion.roll,target.roll,p);
      for (const key of ["gazeLX","gazeLY","gazeRX","gazeRY","blink","mouth"]) {
        motion[key]=mix(motion[key],target[key],details);
      }

      potato.style.left=motion.x+"px";
      potato.style.top=motion.top+"px";
      potato.style.width=motion.width+"px";
      potato.style.transform=`translate(-50%,0) rotate(${motion.roll*180/Math.PI}deg)`;

      const eyeScale=Math.max(.08,1-motion.blink*.92);
      eyeLeft.setAttribute("transform",`translate(${motion.gazeLX} ${motion.gazeLY}) scale(1 ${eyeScale})`);
      eyeRight.setAttribute("transform",`translate(${motion.gazeRX} ${motion.gazeRY}) scale(1 ${eyeScale})`);

      // SVG 경로의 시작과 끝을 같은 높이로 두어 입이 뒤집혀 보이지 않게 합니다.
      if (motion.mouth<.18) {
        mouth.style.opacity="1";
        mouthOpen.style.opacity="0";
        mouth.setAttribute("d","M215 350 Q250 382 285 350");
      } else {
        mouth.style.opacity="0";
        mouthOpen.style.opacity=String(clamp((motion.mouth-.12)*1.25,0,1));
        mouthOpen.setAttribute("ry",String(5+motion.mouth*24));
      }
    }

    function track(now) {
      if (video.readyState>=2 && video.currentTime!==lastVideoTime && now-lastInferenceTime>=40) {
        lastVideoTime=video.currentTime;
        lastInferenceTime=now;
        try {
          const faceResult=faceTracker.detectForVideo(video,now);
          const poseResult=poseTracker.detectForVideo(video,now);
          updateTracking(faceResult,poseResult,now);
        } catch(error) {
          console.warn("인식 프레임을 건너뜁니다.",error);
        }
      }

      if (filterOn) drawBackground();
      else {
        resizeCanvas();
        ctx.save();
        ctx.translate(output.width,0);
        ctx.scale(-1,1);
        const scale=Math.max(output.width/video.videoWidth,output.height/video.videoHeight);
        const w=video.videoWidth*scale,h=video.videoHeight*scale;
        ctx.drawImage(video,(output.width-w)/2,(output.height-h)/2,w,h);
        ctx.restore();
      }

      renderAvatar(now);
      requestAnimationFrame(track);
    }

    window.addEventListener("resize",()=>{
      target.x=innerWidth/2;
      target.width=Math.min(innerWidth*.54,700);
      drawBackground();
    });

    drawBackground();
    start();
  </script>
</body>
</html>
