<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Potato Virtual</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    body { font-family: Arial, sans-serif; }
    .stage { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: #171717; }
    #camera {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); background: #171717;
    }
    #avatar-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #potato {
      position: absolute; left: 50%; top: 50%; width: clamp(150px, 23vw, 310px);
      aspect-ratio: 0.82; transform: translate(-50%, -50%);
      transform-origin: 50% 55%; opacity: 0; will-change: left, top, transform, opacity;
      filter: drop-shadow(0 9px 12px rgba(0,0,0,.18));
    }
    #potato svg { width: 100%; height: 100%; overflow: visible; }
    .eye { transform-box: fill-box; transform-origin: center; }
    #mouth { transform-box: fill-box; transform-origin: center; }
    #filter-toggle {
      position: absolute; z-index: 5; right: 22px; bottom: 22px;
      border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      padding: 13px 22px; color: white; background: rgba(20,20,20,.72);
      backdrop-filter: blur(12px); font-size: 15px; font-weight: 650;
      cursor: pointer;
    }
    #filter-toggle:hover { background: rgba(20,20,20,.9); }
    #filter-toggle:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #status {
      position: absolute; z-index: 4; left: 18px; bottom: 22px;
      color: rgba(255,255,255,.78); font-size: 12px;
      text-shadow: 0 1px 5px #000; pointer-events: none;
    }
    @media (max-width: 600px) {
      #filter-toggle { right: 14px; bottom: 14px; padding: 11px 18px; }
      #status { left: 14px; bottom: 18px; }
      #potato { width: clamp(145px, 42vw, 230px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <video id="camera" autoplay playsinline muted></video>
    <div id="avatar-layer" aria-hidden="true">
      <div id="potato">
        <svg viewBox="0 0 300 360" role="img" aria-label="감자 캐릭터">
          <defs>
            <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e7c58e"/>
              <stop offset=".55" stop-color="#c99a5d"/>
              <stop offset="1" stop-color="#a97843"/>
            </linearGradient>
          </defs>
          <path d="M150 20 C205 12 257 54 273 119 C289 184 272 270 226 316 C188 354 108 351 66 318 C20 282 13 202 29 132 C44 68 91 26 150 20Z"
            fill="url(#skin)" stroke="#8f6239" stroke-width="5"/>
          <path d="M58 99 Q75 82 87 91 M219 70 Q235 78 239 94 M42 229 Q55 219 64 230 M227 275 Q242 263 250 276"
            fill="none" stroke="#ae804e" stroke-width="5" stroke-linecap="round" opacity=".55"/>
          <ellipse class="eye" id="eye-left" cx="105" cy="164" rx="8" ry="10" fill="#292019"/>
          <ellipse class="eye" id="eye-right" cx="195" cy="164" rx="8" ry="10" fill="#292019"/>
          <path id="mouth" d="M137 218 Q150 224 163 218" fill="none" stroke="#553322" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div id="status">카메라 연결 중...</div>
    <button id="filter-toggle" type="button" aria-pressed="true">필터 끄기</button>
  </main>

  <script type="module">
    import { FaceLandmarker, PoseLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("camera");
    const potato = document.getElementById("potato");
    const toggle = document.getElementById("filter-toggle");
    const status = document.getElementById("status");
    const eyeLeft = document.getElementById("eye-left");
    const eyeRight = document.getElementById("eye-right");
    const mouth = document.getElementById("mouth");

    let faceTracker, poseTracker;
    let filterOn = true;
    let lastVideoTime = -1;
    let lastInferenceTime = 0;
    let lastFrameTime = 0;
    let lastFaceTime = 0;
    let hasFace = false;

    const motion = {
      x: innerWidth / 2, y: innerHeight / 2,
      roll: 0, scale: 1,
      gazeLX: 0, gazeLY: 0, gazeRX: 0, gazeRY: 0,
      blink: 0, mouth: 0
    };
    const target = { ...motion };

    toggle.addEventListener("click", () => {
      filterOn = !filterOn;
      toggle.textContent = filterOn ? "필터 끄기" : "필터 켜기";
      toggle.setAttribute("aria-pressed", String(filterOn));
      potato.style.opacity = filterOn && hasFace ? "1" : "0";
    });

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const mix = (a, b, amount) => a + (b - a) * amount;
    // 프레임률이 달라도 움직임의 부드러움이 일정하도록 시간 기반 보간을 사용합니다.
    const smoothing = (dt, speed) => 1 - Math.exp(-dt * speed);

    function getBlendshape(categories, name) {
      return categories?.find(item => item.categoryName === name)?.score ?? 0;
    }

    // object-fit: cover로 잘린 영역과 좌우 반전을 모두 반영해 영상 좌표를 화면 좌표로 변환합니다.
    function videoPointToScreen(point) {
      const vw = video.videoWidth || 1;
      const vh = video.videoHeight || 1;
      const scale = Math.max(innerWidth / vw, innerHeight / vh);
      const renderedW = vw * scale;
      const renderedH = vh * scale;
      const cropX = (renderedW - innerWidth) / 2;
      const cropY = (renderedH - innerHeight) / 2;
      return {
        x: innerWidth - (point.x * renderedW - cropX),
        y: point.y * renderedH - cropY
      };
    }

    function resetFaceTargets() {
      target.blink = 0;
      target.mouth = 0;
      target.gazeLX = target.gazeLY = target.gazeRX = target.gazeRY = 0;
    }

    async function createTrackerWithFallback(Tracker, vision, options) {
      try {
        return await Tracker.createFromOptions(vision, options);
      } catch (gpuError) {
        // 일부 기기나 브라우저에서 GPU delegate를 지원하지 않으면 CPU로 자동 전환합니다.
        console.warn("GPU delegate unavailable; retrying with CPU.", gpuError);
        const cpuOptions = {
          ...options,
          baseOptions: { ...options.baseOptions, delegate: "CPU" }
        };
        return await Tracker.createFromOptions(vision, cpuOptions);
      }
    }

    async function start() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("이 브라우저에서는 카메라 접근을 지원하지 않습니다. HTTPS 환경에서 열어 주세요.");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, max: 30 }
          }
        });
        video.srcObject = stream;
        await new Promise((resolve, reject) => {
          video.addEventListener("loadeddata", resolve, { once: true });
          video.addEventListener("error", reject, { once: true });
        });
        await video.play();

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        const modelBase = "https://storage.googleapis.com/mediapipe-models";
        faceTracker = await createTrackerWithFallback(FaceLandmarker, vision, {
          baseOptions: {
            modelAssetPath: modelBase + "/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          minFaceDetectionConfidence: 0.55,
          minFacePresenceConfidence: 0.55,
          minTrackingConfidence: 0.55,
          outputFaceBlendshapes: true
        });
        poseTracker = await createTrackerWithFallback(PoseLandmarker, vision, {
          baseOptions: {
            modelAssetPath: modelBase + "/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1,
          minPoseDetectionConfidence: 0.5,
          minPosePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        status.textContent = "얼굴과 움직임 인식 중";
        requestAnimationFrame(track);
      } catch (error) {
        console.error(error);
        status.textContent = error?.message?.includes("GPU")
          ? "그래픽 가속 초기화 실패. 브라우저를 새로고침해 주세요."
          : "카메라 또는 인식 모델을 불러오지 못했습니다.";
      }
    }

    function updateFace(faceResult, poseResult, now) {
      const face = faceResult.faceLandmarks?.[0];
      if (!face) {
        if (now - lastFaceTime > 220) {
          hasFace = false;
          resetFaceTargets();
          potato.style.opacity = "0";
        }
        return;
      }

      hasFace = true;
      lastFaceTime = now;
      const nose = face[1];
      const leftOuter = face[33];
      const rightOuter = face[263];
      const leftScreen = videoPointToScreen(leftOuter);
      const rightScreen = videoPointToScreen(rightOuter);
      const noseScreen = videoPointToScreen(nose);
      const eyeDistancePx = Math.hypot(rightScreen.x - leftScreen.x, rightScreen.y - leftScreen.y);

      target.x = noseScreen.x;
      target.y = noseScreen.y - eyeDistancePx * 0.42;

      // 눈 사이 거리로 얼굴 크기를 추정해 카메라와의 거리에 맞춰 캐릭터 크기를 조절합니다.
      const baseWidth = Math.min(310, Math.max(150, innerWidth * (innerWidth <= 600 ? 0.42 : 0.23)));
      target.scale = clamp((eyeDistancePx * 2.25) / baseWidth, 0.68, 1.5);

      // 눈 기울기는 좌우 반전된 화면 좌표에서 계산합니다.
      target.roll = Math.atan2(rightScreen.y - leftScreen.y, rightScreen.x - leftScreen.x);

      const blend = faceResult.faceBlendshapes?.[0]?.categories;
      target.blink = clamp(Math.max(
        getBlendshape(blend, "eyeBlinkLeft"),
        getBlendshape(blend, "eyeBlinkRight")
      ), 0, 1);
      target.mouth = clamp(getBlendshape(blend, "jawOpen"), 0, 1);

      // 홍채를 각 눈의 실제 경계 안에서 정규화해 시선 이동량을 구합니다.
      if (face.length > 473) {
        const eyeData = [
          { iris: face[468], a: face[33], b: face[133], top: face[159], bottom: face[145] },
          { iris: face[473], a: face[362], b: face[263], top: face[386], bottom: face[374] }
        ];
        const gaze = eyeData.map(({ iris, a, b, top, bottom }) => {
          const centerX = (a.x + b.x) / 2;
          const centerY = (top.y + bottom.y) / 2;
          const halfW = Math.max(Math.abs(a.x - b.x) / 2, 0.002);
          const halfH = Math.max(Math.abs(top.y - bottom.y) / 2, 0.002);
          return {
            x: clamp((iris.x - centerX) / halfW, -1, 1) * 7,
            y: clamp((iris.y - centerY) / halfH, -1, 1) * 5
          };
        });
        target.gazeLX = gaze[0].x;
        target.gazeLY = gaze[0].y;
        target.gazeRX = gaze[1].x;
        target.gazeRY = gaze[1].y;
      }

      // 어깨 추적은 얼굴 추적을 보조하는 정도로만 반영해 캐릭터가 과하게 흔들리지 않게 합니다.
      const pose = poseResult.poseLandmarks?.[0];
      if (pose?.[11] && pose?.[12]) {
        const leftShoulder = pose[11];
        const rightShoulder = pose[12];
        const visible = Math.min(leftShoulder.visibility ?? 0, rightShoulder.visibility ?? 0);
        if (visible > 0.45) {
          const shoulders = videoPointToScreen({
            x: (leftShoulder.x + rightShoulder.x) / 2,
            y: (leftShoulder.y + rightShoulder.y) / 2
          });
          target.x = mix(target.x, shoulders.x, 0.10);
          target.y = mix(target.y, shoulders.y - eyeDistancePx * 1.25, 0.10);
        }
      }

      if (filterOn) potato.style.opacity = "1";
    }

    function render(now) {
      const dt = Math.min((now - (lastFrameTime || now)) / 1000, 0.05);
      lastFrameTime = now;
      const positionAlpha = smoothing(dt, 13);
      const detailAlpha = smoothing(dt, 20);
      const scaleAlpha = smoothing(dt, 8);

      motion.x = mix(motion.x, target.x, positionAlpha);
      motion.y = mix(motion.y, target.y, positionAlpha);
      motion.roll = mix(motion.roll, target.roll, positionAlpha);
      motion.scale = mix(motion.scale, target.scale, scaleAlpha);
      motion.gazeLX = mix(motion.gazeLX, target.gazeLX, detailAlpha);
      motion.gazeLY = mix(motion.gazeLY, target.gazeLY, detailAlpha);
      motion.gazeRX = mix(motion.gazeRX, target.gazeRX, detailAlpha);
      motion.gazeRY = mix(motion.gazeRY, target.gazeRY, detailAlpha);
      motion.blink = mix(motion.blink, target.blink, detailAlpha);
      motion.mouth = mix(motion.mouth, target.mouth, detailAlpha);

      potato.style.left = motion.x + "px";
      potato.style.top = motion.y + "px";
      potato.style.transform =
        `translate(-50%, -50%) rotate(${motion.roll * 180 / Math.PI}deg) scale(${motion.scale})`;

      const eyeY = Math.max(0.08, 1 - motion.blink * 0.92);
      eyeLeft.setAttribute("transform", `translate(${motion.gazeLX} ${motion.gazeLY}) scale(1 ${eyeY})`);
      eyeRight.setAttribute("transform", `translate(${motion.gazeRX} ${motion.gazeRY}) scale(1 ${eyeY})`);

      const mouthHeight = 3 + motion.mouth * 34;
      mouth.setAttribute("d", `M137 218 Q150 ${218 + mouthHeight} 163 218`);
      mouth.setAttribute("stroke-width", String(6 + motion.mouth * 2));
    }

    function track(now) {
      // 화면 렌더링은 매 프레임, 무거운 AI 추론은 초당 최대 약 30회만 실행합니다.
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime && now - lastInferenceTime >= 30) {
        lastVideoTime = video.currentTime;
        lastInferenceTime = now;
        try {
          const faceResult = faceTracker.detectForVideo(video, now);
          const poseResult = poseTracker.detectForVideo(video, now);
          updateFace(faceResult, poseResult, now);
        } catch (error) {
          console.warn("Tracking frame skipped:", error);
        }
      }
      render(now);
      requestAnimationFrame(track);
    }

    window.addEventListener("resize", () => {
      target.x = innerWidth / 2;
      target.y = innerHeight / 2;
    });

    start();
  </script>
</body>
</html>
