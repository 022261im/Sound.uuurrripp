<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Potato Virtual</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#171717; }
    body { font-family:Arial,sans-serif; }
    .stage { position:relative; width:100vw; height:100dvh; overflow:hidden; background:#171717; }
    #output { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #camera { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    #avatar-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    #potato {
      position:absolute; left:50%; top:0; width:420px; aspect-ratio:0.72;
      transform:translate(-50%,0); transform-origin:50% 30%;
      opacity:0; will-change:left,top,width,transform,opacity;
      filter:drop-shadow(0 12px 16px rgba(65,39,17,.15));
    }
    #potato svg { width:100%; height:100%; display:block; overflow:visible; }
    .eye { transform-box:fill-box; transform-origin:center; }
    #background-picker {
      position:absolute; z-index:6; right:20px; bottom:88px;
      display:flex; align-items:center; gap:8px;
      padding:9px 11px; border:1px solid rgba(255,255,255,.18);
      border-radius:18px; background:rgba(20,20,20,.72);
      backdrop-filter:blur(12px);
    }
    .background-choice {
      width:27px; height:27px; border-radius:50%; border:2px solid rgba(255,255,255,.55);
      padding:0; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25);
    }
    .background-choice[aria-pressed="true"] { outline:2px solid white; outline-offset:3px; }
    .background-choice:focus-visible { outline:3px solid white; outline-offset:4px; }
    #filter-toggle {
      position:absolute; z-index:6; right:20px; bottom:20px;
      border:1px solid rgba(255,255,255,.25); border-radius:999px;
      padding:13px 22px; color:white; background:rgba(20,20,20,.76);
      backdrop-filter:blur(12px); font-size:15px; font-weight:650; cursor:pointer;
    }
    #filter-toggle:hover { background:rgba(20,20,20,.94); }
    #filter-toggle:focus-visible { outline:3px solid white; outline-offset:3px; }
    #status {
      position:absolute; z-index:4; left:18px; bottom:20px;
      color:rgba(255,255,255,.8); font-size:12px;
      text-shadow:0 1px 5px #000; pointer-events:none;
    }
    @media(max-width:600px) {
      #background-picker { right:14px; bottom:78px; gap:7px; padding:8px 10px; }
      .background-choice { width:25px; height:25px; }
      #filter-toggle { right:14px; bottom:14px; padding:11px 18px; }
      #potato { width: min(108vw, 520px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="output"></canvas>
    <video id="camera" autoplay playsinline muted></video>

    <div id="avatar-layer" aria-hidden="true">
      <div id="potato">
        <svg viewBox="0 0 500 700">
          <defs>
            <linearGradient id="skin" x1="0" y1="0" x2="0.85" y2="1">
              <stop offset="0" stop-color="#e9c58e"/>
              <stop offset=".52" stop-color="#d7aa70"/>
              <stop offset="1" stop-color="#bd8951"/>
            </linearGradient>
            <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a97843" stop-opacity=".08"/>
              <stop offset="1" stop-color="#81552e" stop-opacity=".24"/>
            </linearGradient>
          </defs>
          <!-- 머리부터 어깨와 상체까지 이어지는 큰 감자 실루엣 -->
          <path d="M250 10
            C365 4 457 75 480 190
            C501 293 476 405 457 500
            C445 565 468 630 440 676
            C408 724 92 724 60 676
            C32 630 55 565 43 500
            C24 405 -1 293 20 190
            C43 75 135 4 250 10Z"
            fill="url(#skin)" stroke="#a87948" stroke-width="7"/>
          <path d="M250 14
            C365 8 451 80 472 190
            C490 286 468 402 449 496
            C438 562 458 625 431 665
            C395 700 105 700 69 665
            C42 625 62 562 51 496
            C32 402 10 286 28 190
            C49 80 135 8 250 14Z"
            fill="url(#shade)"/>
          <!-- 감자 표면의 작은 점 -->
          <path d="M93 150 Q111 126 132 137 M369 115 Q391 125 402 148
                   M74 440 Q92 457 108 448 M389 468 Q411 481 426 462"
            fill="none" stroke="#b88752" stroke-width="13" stroke-linecap="round" opacity=".28"/>
          <ellipse class="eye" id="eye-left" cx="185" cy="286" rx="11" ry="14" fill="#302219"/>
          <ellipse class="eye" id="eye-right" cx="315" cy="286" rx="11" ry="14" fill="#302219"/>
          <path id="mouth" d="M215 350 Q250 382 285 350" fill="none"
            stroke="#583827" stroke-width="8" stroke-linecap="round"/>
          <ellipse id="mouth-open" cx="250" cy="362" rx="21" ry="4"
            fill="#583827" opacity="0" />
        </svg>
      </div>
    </div>

    <div id="status">카메라 연결 중...</div>
    <div id="background-picker" aria-label="배경 선택">
      <button class="background-choice" type="button" data-bg="#dce8e5" aria-label="연한 민트 배경" title="민트" style="background:#dce8e5" aria-pressed="true"></button>
      <button class="background-choice" type="button" data-bg="#e8d8c4" aria-label="베이지 배경" title="베이지" style="background:#e8d8c4" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#cbd8ed" aria-label="하늘색 배경" title="하늘색" style="background:#cbd8ed" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#e8cbd0" aria-label="분홍 배경" title="분홍" style="background:#e8cbd0" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#d5d5d5" aria-label="회색 배경" title="회색" style="background:#d5d5d5" aria-pressed="false"></button>
      <button class="background-choice" type="button" data-bg="#252b35" aria-label="짙은 남색 배경" title="다크" style="background:#252b35" aria-pressed="false"></button>
    </div>
    <button id="filter-toggle" type="button" aria-pressed="true">필터 끄기</button>
  </main>

  <script type="module">
    import { FaceLandmarker, PoseLandmarker, ImageSegmenter, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("camera");
    const output = document.getElementById("output");
    const out = output.getContext("2d", { alpha:false });
    const potato = document.getElementById("potato");
    const toggle = document.getElementById("filter-toggle");
    const status = document.getElementById("status");
    const eyeLeft = document.getElementById("eye-left");
    const eyeRight = document.getElementById("eye-right");
    const mouth = document.getElementById("mouth");
    const mouthOpen = document.getElementById("mouth-open");
    const bgButtons = [...document.querySelectorAll(".background-choice")];

    const personCanvas = document.createElement("canvas");
    const personCtx = personCanvas.getContext("2d");
    const maskCanvas = document.createElement("canvas");
    const maskCtx = maskCanvas.getContext("2d", { willReadFrequently:true });

    let faceTracker, poseTracker, segmenter;
    let filterOn = true, backgroundColor = "#dce8e5";
    let lastVideoTime = -1, lastInferenceTime = 0, lastFrameTime = 0;
    let lastFaceTime = 0, hasFace = false, latestMask = null;
    let maskWidth = 0, maskHeight = 0;

    const motion = {
      x:innerWidth/2, top:0, width:420, roll:0, scale:1,
      gazeLX:0, gazeLY:0, gazeRX:0, gazeRY:0, blink:0, mouth:0
    };
    const target = { ...motion };

    const clamp = (v,min,max) => Math.max(min,Math.min(max,v));
    const mix = (a,b,t) => a+(b-a)*t;
    const smoothing = (dt,speed) => 1-Math.exp(-dt*speed);
    const getBlendshape = (categories,name) =>
      categories?.find(item => item.categoryName===name)?.score ?? 0;

    bgButtons.forEach(button => button.addEventListener("click", () => {
      backgroundColor = button.dataset.bg;
      bgButtons.forEach(item => item.setAttribute("aria-pressed", String(item===button)));
    }));

    toggle.addEventListener("click", () => {
      filterOn = !filterOn;
      toggle.textContent = filterOn ? "필터 끄기" : "필터 켜기";
      toggle.setAttribute("aria-pressed", String(filterOn));
      potato.style.opacity = filterOn && hasFace ? "1" : "0";
    });

    function resizeCanvases() {
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
      if (output.width!==w || output.height!==h) {
        output.width=w; output.height=h;
        personCanvas.width=w; personCanvas.height=h;
      }
    }

    function drawCover(ctx, source, mirror=false) {
      const w=output.width, h=output.height;
      const sw=source.videoWidth || source.width, sh=source.videoHeight || source.height;
      const scale=Math.max(w/sw,h/sh), dw=sw*scale, dh=sh*scale;
      const dx=(w-dw)/2, dy=(h-dh)/2;
      ctx.save();
      if (mirror) {
        ctx.translate(w,0);
        ctx.scale(-1,1);
      }
      ctx.drawImage(source,dx,dy,dw,dh);
      ctx.restore();
    }

    function updateMask(mask) {
      if (!mask) return;
      const width=mask.width, height=mask.height;
      const values=mask.getAsUint8Array();
      if (maskCanvas.width!==width || maskCanvas.height!==height) {
        maskCanvas.width=width; maskCanvas.height=height;
      }
      const pixels=maskCtx.createImageData(width,height);
      for (let i=0;i<values.length;i++) {
        const alpha=values[i] > 0 ? 255 : 0;
        const p=i*4;
        pixels.data[p]=255; pixels.data[p+1]=255; pixels.data[p+2]=255;
        pixels.data[p+3]=alpha;
      }
      maskCtx.putImageData(pixels,0,0);
      // 가장자리를 약간 부드럽게 만들어 인물 테두리의 계단 현상을 완화합니다.
      personCtx.save();
      personCtx.globalCompositeOperation="destination-in";
      personCtx.filter="blur(2px)";
      drawCover(personCtx,maskCanvas,true);
      personCtx.restore();
    }

    function renderCamera() {
      resizeCanvases();
      const w=output.width,h=output.height;
      out.clearRect(0,0,w,h);

      if (!filterOn) {
        drawCover(out,video,true);
        return;
      }

      out.fillStyle=backgroundColor;
      out.fillRect(0,0,w,h);
      if (latestMask) {
        personCtx.clearRect(0,0,w,h);
        drawCover(personCtx,video,true);
        personCtx.globalCompositeOperation="destination-in";
        personCtx.save();
        personCtx.filter="blur(1.5px)";
        drawCover(personCtx,maskCanvas,true);
        personCtx.restore();
        personCtx.globalCompositeOperation="source-over";
        out.drawImage(personCanvas,0,0);
      }
    }

    function videoPointToScreen(point) {
      const vw=video.videoWidth||1, vh=video.videoHeight||1;
      const scale=Math.max(innerWidth/vw,innerHeight/vh);
      const renderedW=vw*scale, renderedH=vh*scale;
      const cropX=(renderedW-innerWidth)/2, cropY=(renderedH-innerHeight)/2;
      return {
        x:innerWidth-(point.x*renderedW-cropX),
        y:point.y*renderedH-cropY
      };
    }

    function resetFaceTargets() {
      target.blink=0; target.mouth=0;
      target.gazeLX=target.gazeLY=target.gazeRX=target.gazeRY=0;
    }

    async function createTrackerWithFallback(Tracker,vision,options) {
      try { return await Tracker.createFromOptions(vision,options); }
      catch (error) {
        console.warn("GPU 초기화 실패, CPU로 전환합니다.",error);
        return await Tracker.createFromOptions(vision,{
          ...options,baseOptions:{...options.baseOptions,delegate:"CPU"}
        });
      }
    }

    async function start() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error("카메라 권한을 사용할 수 없습니다.");
        const stream=await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}
        });
        video.srcObject=stream;
        await new Promise((resolve,reject)=>{
          video.addEventListener("loadeddata",resolve,{once:true});
          video.addEventListener("error",reject,{once:true});
        });
        await video.play();

        const vision=await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        const modelBase="https://storage.googleapis.com/mediapipe-models";
        faceTracker=await createTrackerWithFallback(FaceLandmarker,vision,{
          baseOptions:{modelAssetPath:modelBase+"/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
          runningMode:"VIDEO",numFaces:1,minFaceDetectionConfidence:.55,
          minFacePresenceConfidence:.55,minTrackingConfidence:.55,outputFaceBlendshapes:true
        });
        poseTracker=await createTrackerWithFallback(PoseLandmarker,vision,{
          baseOptions:{modelAssetPath:modelBase+"/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
          runningMode:"VIDEO",numPoses:1,minPoseDetectionConfidence:.5,
          minPosePresenceConfidence:.5,minTrackingConfidence:.5
        });
        segmenter=await createTrackerWithFallback(ImageSegmenter,vision,{
          baseOptions:{
            modelAssetPath:modelBase+"/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite",
            delegate:"GPU"
          },
          runningMode:"VIDEO",outputCategoryMask:true,outputConfidenceMasks:false
        });
        status.textContent="얼굴과 배경 분리 인식 중";
        requestAnimationFrame(track);
      } catch(error) {
        console.error(error);
        status.textContent="카메라 또는 인식 모델을 불러오지 못했습니다.";
      }
    }

    function updateFace(faceResult,poseResult,now) {
      const face=faceResult.faceLandmarks?.[0];
      if (!face) {
        if (now-lastFaceTime>260) {
          hasFace=false; resetFaceTargets(); potato.style.opacity="0";
        }
        return;
      }
      hasFace=true; lastFaceTime=now;
      const noseScreen=videoPointToScreen(face[1]);
      const leftScreen=videoPointToScreen(face[33]);
      const rightScreen=videoPointToScreen(face[263]);
      const eyeDistance=Math.hypot(rightScreen.x-leftScreen.x,rightScreen.y-leftScreen.y);
      const pose=poseResult.poseLandmarks?.[0];

      let centerX=noseScreen.x;
      let shoulderY=noseScreen.y+eyeDistance*2.2;
      let shoulderWidth=eyeDistance*4.8;
      if (pose?.[11] && pose?.[12]) {
        const l=pose[11],r=pose[12];
        const visibility=Math.min(l.visibility??0,r.visibility??0);
        if (visibility>.35) {
          const ls=videoPointToScreen(l),rs=videoPointToScreen(r);
          centerX=(ls.x+rs.x)/2;
          shoulderY=(ls.y+rs.y)/2;
          shoulderWidth=Math.hypot(rs.x-ls.x,rs.y-ls.y);
        }
      }

      // 상체 너비를 기준으로 감자 몸통을 배치해 머리만 떠다니는 느낌을 줄입니다.
      target.width=clamp(shoulderWidth*2.05,Math.min(300,innerWidth*.78),innerWidth*1.12);
      const avatarHeight=target.width/0.72;
      const headTop=noseScreen.y-eyeDistance*2.65;
      target.x=centerX;
      target.top=clamp(headTop, -avatarHeight*.04, innerHeight*.28);
      target.roll=clamp(Math.atan2(rightScreen.y-leftScreen.y,rightScreen.x-leftScreen.x),-.22,.22);
      target.scale=1;

      const blend=faceResult.faceBlendshapes?.[0]?.categories;
      target.blink=clamp(Math.max(getBlendshape(blend,"eyeBlinkLeft"),getBlendshape(blend,"eyeBlinkRight")),0,1);
      target.mouth=clamp(getBlendshape(blend,"jawOpen"),0,1);

      if (face.length>473) {
        const eyes=[
          {iris:face[468],a:face[33],b:face[133],top:face[159],bottom:face[145]},
          {iris:face[473],a:face[362],b:face[263],top:face[386],bottom:face[374]}
        ];
        const gaze=eyes.map(({iris,a,b,top,bottom})=>{
          const cx=(a.x+b.x)/2,cy=(top.y+bottom.y)/2;
          const hw=Math.max(Math.abs(a.x-b.x)/2,.002);
          const hh=Math.max(Math.abs(top.y-bottom.y)/2,.002);
          return {x:clamp((iris.x-cx)/hw,-1,1)*8,y:clamp((iris.y-cy)/hh,-1,1)*6};
        });
        target.gazeLX=gaze[0].x; target.gazeLY=gaze[0].y;
        target.gazeRX=gaze[1].x; target.gazeRY=gaze[1].y;
      }
      potato.style.opacity=filterOn?"1":"0";
    }

    function renderAvatar(now) {
      const dt=Math.min((now-(lastFrameTime||now))/1000,.05);
      lastFrameTime=now;
      const p=smoothing(dt,11),d=smoothing(dt,19),sz=smoothing(dt,8);
      motion.x=mix(motion.x,target.x,p);
      motion.top=mix(motion.top,target.top,p);
      motion.width=mix(motion.width,target.width,sz);
      motion.roll=mix(motion.roll,target.roll,p);
      motion.gazeLX=mix(motion.gazeLX,target.gazeLX,d);
      motion.gazeLY=mix(motion.gazeLY,target.gazeLY,d);
      motion.gazeRX=mix(motion.gazeRX,target.gazeRX,d);
      motion.gazeRY=mix(motion.gazeRY,target.gazeRY,d);
      motion.blink=mix(motion.blink,target.blink,d);
      motion.mouth=mix(motion.mouth,target.mouth,d);

      potato.style.left=motion.x+"px";
      potato.style.top=motion.top+"px";
      potato.style.width=motion.width+"px";
      potato.style.transform=`translate(-50%,0) rotate(${motion.roll*180/Math.PI}deg)`;

      const eyeY=Math.max(.08,1-motion.blink*.92);
      eyeLeft.setAttribute("transform",`translate(${motion.gazeLX} ${motion.gazeLY}) scale(1 ${eyeY})`);
      eyeRight.setAttribute("transform",`translate(${motion.gazeRX} ${motion.gazeRY}) scale(1 ${eyeY})`);

      // 닫힌 입은 아래로 볼록한 미소, 입을 벌리면 별도의 타원형 입으로 전환합니다.
      if (motion.mouth<.16) {
        mouth.style.opacity="1"; mouthOpen.style.opacity="0";
        mouth.setAttribute("d","M215 350 Q250 384 285 350");
      } else {
        mouth.style.opacity="0";
        mouthOpen.style.opacity=String(clamp(motion.mouth*1.15,0,1));
        mouthOpen.setAttribute("ry",String(4+motion.mouth*25));
      }
    }

    function track(now) {
      if (video.readyState>=2 && video.currentTime!==lastVideoTime && now-lastInferenceTime>=45) {
        lastVideoTime=video.currentTime; lastInferenceTime=now;
        try {
          const faceResult=faceTracker.detectForVideo(video,now);
          const poseResult=poseTracker.detectForVideo(video,now);
          updateFace(faceResult,poseResult,now);
          const segmentation=segmenter.segmentForVideo(video,now);
          const categoryMask=segmentation.categoryMask;
          if (categoryMask) {
            const width=categoryMask.width,height=categoryMask.height;
            if (maskCanvas.width!==width || maskCanvas.height!==height) {
              maskCanvas.width=width; maskCanvas.height=height;
            }
            const values=categoryMask.getAsUint8Array();
            const pixels=maskCtx.createImageData(width,height);
            for (let i=0;i<values.length;i++) {
              const p=i*4;
              pixels.data[p]=255; pixels.data[p+1]=255; pixels.data[p+2]=255;
              pixels.data[p+3]=values[i]===0?0:255;
            }
            maskCtx.putImageData(pixels,0,0);
            latestMask=maskCanvas;
            categoryMask.close?.();
          }
        } catch(error) { console.warn("인식 프레임을 건너뜁니다.",error); }
      }
      renderCamera();
      renderAvatar(now);
      requestAnimationFrame(track);
    }

    window.addEventListener("resize",()=>{
      target.x=innerWidth/2;
      resizeCanvases();
    });
    start();
  </script>
</body>
</html>
